name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        # pin 到本机开发版本（1.3.11）；升级依赖时一并 bump
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck + tests
        run: bun run check
      - name: Check formatting
        run: bun run format:check

  # `peerDependencies` are `"*"`, so nothing at install time stops an older Pi
  # from loading this code. This job is what makes the declared floor in
  # `package.json` -> `engines.pi` (and docs/upstream-baseline.md) true.
  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Read the minimum supported Pi version
        id: floor
        run: |
          range=$(jq -r '.engines.pi' package.json)
          echo "version=${range#>=}" >> "$GITHUB_OUTPUT"
      - name: Pin the host packages to the floor
        run: >-
          bun add -d
          @earendil-works/pi-coding-agent@${{ steps.floor.outputs.version }}
          @earendil-works/pi-tui@${{ steps.floor.outputs.version }}
      - name: Typecheck + tests against the floor
        env:
          PI_MATRIX_LEG: minimum
        run: bun run check

  packaging:
    needs: [check, minimum]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - run: bun run smoke:installed
